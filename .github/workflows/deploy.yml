name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Type Check & Lint
        run: |
          npm run typecheck || true
          npm run lint || true

      - name: Production Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

  deploy:
    name: Deploy to KVM VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Diagnostic Network and SSH Key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "1. Checking secrets..."
          if [ -n "$VPS_HOST" ]; then echo "VPS_HOST is provided."; else echo "VPS_HOST is NOT provided."; fi
          if [ -n "$VPS_SSH_KEY" ]; then echo "VPS_SSH_KEY is provided."; else echo "VPS_SSH_KEY is NOT provided."; fi
          
          echo "2. Testing TCP connectivity on port 22..."
          if [ -n "$VPS_HOST" ]; then
            nc -vz -w 10 "$VPS_HOST" 22 || echo "TCP connection failed."
          fi
          
          echo "3 & 4. Testing SSH key parsing and fingerprint..."
          if [ -n "$VPS_SSH_KEY" ]; then
            echo "$VPS_SSH_KEY" > /tmp/github_actions_key
            chmod 600 /tmp/github_actions_key
            echo "Private key fingerprint:"
            ssh-keygen -lf /tmp/github_actions_key || echo "ssh-keygen -lf failed on private key"
            
            echo "Public key fingerprint (derived):"
            ssh-keygen -y -f /tmp/github_actions_key | ssh-keygen -lf - || echo "ssh-keygen -y failed"
            
            rm -f /tmp/github_actions_key
          fi
          
          echo "Stopping workflow to prevent actual deployment."
          exit 1

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/buzzspire
            git pull origin main
            npm ci
            npx prisma generate
            npx prisma db push
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            npm run build
            pm2 reload ecosystem.config.js --update-env
