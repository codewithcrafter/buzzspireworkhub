name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Type Check & Lint
        run: |
          npm run typecheck || true
          npm run lint || true

      - name: Production Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

  deploy:
    name: Deploy to KVM VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Setup SSH Key from Base64
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          echo "Decoding Base64 SSH key..."
          echo "$VPS_SSH_KEY_B64" | base64 -d > "$RUNNER_TEMP/github_actions_buzzspire"
          chmod 600 "$RUNNER_TEMP/github_actions_buzzspire"
          
          echo "Verifying private key fingerprint:"
          ssh-keygen -lf "$RUNNER_TEMP/github_actions_buzzspire"
          
          echo "Verifying derived public key fingerprint:"
          ssh-keygen -y -f "$RUNNER_TEMP/github_actions_buzzspire" | ssh-keygen -lf -

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ runner.temp }}/github_actions_buzzspire
          script: |
            cd /var/www/buzzspire
            git pull origin main
            npm ci
            npx prisma generate
            npx prisma db push
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            npm run build
            pm2 reload ecosystem.config.js --update-env

      - name: Cleanup SSH Key
        if: always()
        run: rm -f "$RUNNER_TEMP/github_actions_buzzspire"
