name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Type Check & Lint
        run: |
          npm run typecheck || true
          npm run lint || true

      - name: Production Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

  deploy:
    name: Deploy to KVM VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Setup SSH Key from Base64
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          echo "Decoding Base64 SSH key..."
          echo "$VPS_SSH_KEY_B64" | base64 -d > "$RUNNER_TEMP/github_actions_buzzspire"
          chmod 600 "$RUNNER_TEMP/github_actions_buzzspire"
          
          echo "Verifying private key fingerprint:"
          ssh-keygen -lf "$RUNNER_TEMP/github_actions_buzzspire"
          
          echo "Verifying derived public key fingerprint:"
          ssh-keygen -y -f "$RUNNER_TEMP/github_actions_buzzspire" | ssh-keygen -lf -

      - name: Network & SSH Diagnostics
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "=========================================="
          echo "NETWORK & DNS DIAGNOSTICS"
          echo "=========================================="
          echo "VPS_HOST string length: ${#VPS_HOST}"
          SAFE_HOST=$(echo "$VPS_HOST" | sed -E 's/^(.{3}).*(.{3})$/\1***\2/')
          echo "VPS_HOST (redacted): $SAFE_HOST"
          
          echo "--- DNS Lookup (A & AAAA) ---"
          getent ahosts "$VPS_HOST" || true
          host -t A "$VPS_HOST" || true
          host -t AAAA "$VPS_HOST" || true
          
          echo "--- TCP Port 22 Probe (Hostname/Configured VPS_HOST) ---"
          nc -vz -w 10 "$VPS_HOST" 22 || true
          
          echo "--- TCP Port 22 Probe (Explicit IPv4 Hostname/Configured VPS_HOST) ---"
          nc -4 -vz -w 10 "$VPS_HOST" 22 || true
          
          echo "--- TCP Port 22 Probe (Explicit Target IPv4 200.141.12.206) ---"
          nc -vz -w 10 200.141.12.206 22 || true

      - name: SSH Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "Running native SSH diagnostic..."
          ssh -4 \
              -o ConnectTimeout=15 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -i "$RUNNER_TEMP/github_actions_buzzspire" \
              "${VPS_USER}@${VPS_HOST}" "echo SSH_AUTHENTICATION_SUCCESS"
              
          echo "Running deployment commands..."
          ssh -4 \
              -o ConnectTimeout=15 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -i "$RUNNER_TEMP/github_actions_buzzspire" \
              "${VPS_USER}@${VPS_HOST}" << EOF
          cd /var/www/buzzspire
          GIT_SSH_COMMAND="ssh -i ~/.ssh/github_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" git pull origin main
          npm ci
          npx prisma generate
          npx prisma db push
          export DATABASE_URL="${DATABASE_URL}"
          export JWT_SECRET="${JWT_SECRET}"
          export RESEND_API_KEY="${RESEND_API_KEY}"
          npm run build
          pm2 restart buzzspire-app --update-env
          pm2 restart buzzspire-scheduler --update-env || true
          pm2 status
          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f "$RUNNER_TEMP/github_actions_buzzspire"
